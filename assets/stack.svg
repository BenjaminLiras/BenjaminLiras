<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Stack tecnológico: lenguajes, frontend y backend">
  <title>Stack tecnológico</title>
  <defs>
    <clipPath id="round"><rect width="1000" height="380" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace; }
    .c { opacity: 0; animation: pop .5s ease forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .n { fill: #52525b; font-size: 13px; }
    .k { fill: #ef233c; }
    .p { fill: #fb7185; font-size: 14px; }
    .t { fill: #fafafa; font-size: 14px; }
    .cm { fill: #52525b; font-size: 13px; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="380" fill="#0b0b0e"/>
    <rect width="1000" height="44" fill="#0d0d10"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#ffffff" stroke-opacity=".06"/>
    <circle cx="28" cy="22" r="6" fill="#ef233c"/>
    <circle cx="48" cy="22" r="6" fill="#3f3f46"/>
    <circle cx="68" cy="22" r="6" fill="#3f3f46"/>
    <rect x="110" y="0" width="120" height="44" fill="#0b0b0e"/>
    <rect x="110" y="0" width="120" height="2" fill="#ef233c"/>
    <text x="170" y="27" text-anchor="middle" font-size="13" fill="#e4e4e7">stack.ts</text>

    <rect x="0" y="45" width="48" height="299" fill="#0d0d10"/>
    <text class="n" x="24" y="84" text-anchor="middle">1</text>
    <text class="n" x="24" y="144" text-anchor="middle">2</text>
    <text class="n" x="24" y="204" text-anchor="middle">3</text>
    <text class="n" x="24" y="264" text-anchor="middle">4</text>
    <text class="n" x="24" y="324" text-anchor="middle">5</text>

    <text x="70" y="84" font-size="14"><tspan class="k">const</tspan><tspan class="t"> stack </tspan><tspan fill="#a1a1aa">= {</tspan></text>

    <text class="p" x="94" y="144">languages:</text>
    <text class="p" x="94" y="204">frontend:</text>
    <text class="p" x="94" y="264">backend:</text>

    <!-- languages -->
    <g class="c" style="animation-delay:.1s"><rect x="230" y="124" width="70" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="244" cy="139" r="4" fill="#00599c"/><text class="t" x="260" y="144">C++</text></g>
    <g class="c" style="animation-delay:.2s"><rect x="310" y="124" width="78" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="324" cy="139" r="4" fill="#f89820"/><text class="t" x="340" y="144">Java</text></g>
    <g class="c" style="animation-delay:.3s"><rect x="398" y="124" width="95" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="412" cy="139" r="4" fill="#ffd43b"/><text class="t" x="428" y="144">Python</text></g>
    <g class="c" style="animation-delay:.4s"><rect x="503" y="124" width="103" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="517" cy="139" r="4" fill="#00979d"/><text class="t" x="533" y="144">Arduino</text></g>
    <g class="c" style="animation-delay:.5s"><rect x="616" y="124" width="128" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="630" cy="139" r="4" fill="#3178c6"/><text class="t" x="646" y="144">TypeScript</text></g>
    <g class="c" style="animation-delay:.6s"><rect x="754" y="124" width="86" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="768" cy="139" r="4" fill="#478cbf"/><text class="t" x="784" y="144">Godot</text></g>
    <text class="cm" x="870" y="144">// 6</text>

    <!-- frontend -->
    <g class="c" style="animation-delay:.7s"><rect x="230" y="184" width="78" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="244" cy="199" r="4" fill="#e34f26"/><text class="t" x="260" y="204">HTML</text></g>
    <g class="c" style="animation-delay:.8s"><rect x="318" y="184" width="70" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="332" cy="199" r="4" fill="#1572b6"/><text class="t" x="348" y="204">CSS</text></g>
    <g class="c" style="animation-delay:.9s"><rect x="398" y="184" width="128" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="412" cy="199" r="4" fill="#f7df1e"/><text class="t" x="428" y="204">JavaScript</text></g>
    <g class="c" style="animation-delay:1s"><rect x="536" y="184" width="86" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="550" cy="199" r="4" fill="#61dafb"/><text class="t" x="566" y="204">React</text></g>
    <text class="cm" x="870" y="204">// 4</text>

    <!-- backend -->
    <g class="c" style="animation-delay:1.1s"><rect x="230" y="244" width="137" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="244" cy="259" r="4" fill="#6db33f"/><text class="t" x="260" y="264">Spring Boot</text></g>
    <g class="c" style="animation-delay:1.2s"><rect x="377" y="244" width="86" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="391" cy="259" r="4" fill="#4479a1"/><text class="t" x="407" y="264">MySQL</text></g>
    <g class="c" style="animation-delay:1.3s"><rect x="473" y="244" width="103" height="30" rx="8" fill="#14141a" stroke="#ffffff" stroke-opacity=".1"/><circle cx="487" cy="259" r="4" fill="#47a248"/><text class="t" x="503" y="264">MongoDB</text></g>
    <text class="cm" x="870" y="264">// 3</text>

    <text x="70" y="324" font-size="14" fill="#a1a1aa">};<tspan class="cm" dx="14">// y lo que sigue...</tspan></text>

    <rect x="0" y="344" width="1000" height="36" fill="#7f1020"/>
    <text x="20" y="367" font-size="12" fill="#fafafa">main</text>
    <text x="980" y="367" font-size="12" fill="#fecdd3" text-anchor="end">TypeScript  ·  UTF-8  ·  siempre aprendiendo</text>
  </g>
</svg>
