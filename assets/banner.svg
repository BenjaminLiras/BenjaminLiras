<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Benjamin Liras - Técnico en Computación y desarrollo web">
  <title>Benjamin Liras</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#16090e"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="8%" r="65%">
      <stop offset="0" stop-color="#ef233c" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ef233c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="50%">
      <stop offset="0" stop-color="#7f1020" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7f1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef233c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#ef233c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace; }
    .l { opacity: 0; animation: in .6s ease forwards; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sweep { animation: sweep 4s linear infinite; }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1000px); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" fill="url(#glow)"/>
    <rect width="1000" height="320" fill="url(#glow2)"/>

    <rect width="1000" height="44" fill="#0d0d10"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#ffffff" stroke-opacity=".06"/>
    <circle cx="28" cy="22" r="6" fill="#ef233c"/>
    <circle cx="48" cy="22" r="6" fill="#3f3f46"/>
    <circle cx="68" cy="22" r="6" fill="#3f3f46"/>
    <text x="500" y="26" text-anchor="middle" font-size="12" fill="#71717a">~/benjamin-liras  —  zsh</text>

    <text class="l" style="animation-delay:.2s" x="60" y="96" font-size="15"><tspan fill="#ef233c">$</tspan><tspan fill="#a1a1aa"> whoami</tspan></text>

    <text class="l" style="animation-delay:.6s" x="60" y="170" font-size="50" font-weight="700" fill="#fafafa">Benjamin <tspan fill="#ef233c">Liras</tspan></text>

    <text class="l" style="animation-delay:1s" x="60" y="206" font-size="18" fill="#e4e4e7"><tspan fill="#ef233c">&gt;</tspan> Técnico en Computación</text>
    <text class="l" style="animation-delay:1.3s" x="60" y="234" font-size="14" fill="#a1a1aa"><tspan fill="#ef233c">&gt;</tspan> Desarrollo web  ·  Frontend + Backend</text>

    <text class="l" style="animation-delay:1.6s" x="60" y="282" font-size="15"><tspan fill="#ef233c">$</tspan></text>
    <rect class="cur" x="76" y="268" width="9" height="16" fill="#ef233c"/>

    <g class="l" style="animation-delay:.9s">
      <rect x="580" y="76" width="360" height="190" rx="12" fill="#0f0f13" stroke="#ef233c" stroke-opacity=".35"/>
      <text x="604" y="102" font-size="11" fill="#71717a">build_profile.sh</text>
      <line x1="580" y1="114" x2="940" y2="114" stroke="#ffffff" stroke-opacity=".07"/>
    </g>
    <text class="l" style="animation-delay:1.2s" x="604" y="140" font-size="13"><tspan fill="#ef233c">$</tspan><tspan fill="#d4d4d8"> ./build_profile.sh</tspan></text>
    <text class="l" style="animation-delay:1.5s" x="604" y="164" font-size="13"><tspan fill="#22c55e">[ok]</tspan><tspan x="650" fill="#a1a1aa">frontend</tspan><tspan x="760" fill="#fafafa">react</tspan></text>
    <text class="l" style="animation-delay:1.8s" x="604" y="186" font-size="13"><tspan fill="#22c55e">[ok]</tspan><tspan x="650" fill="#a1a1aa">backend</tspan><tspan x="760" fill="#fafafa">spring boot</tspan></text>
    <text class="l" style="animation-delay:2.1s" x="604" y="208" font-size="13"><tspan fill="#22c55e">[ok]</tspan><tspan x="650" fill="#a1a1aa">database</tspan><tspan x="760" fill="#fafafa">mysql, mongodb</tspan></text>
    <text class="l" style="animation-delay:2.4s" x="604" y="230" font-size="13"><tspan fill="#22c55e">[ok]</tspan><tspan x="650" fill="#a1a1aa">graduación</tspan><tspan x="760" fill="#fafafa">2026</tspan></text>
    <text class="l" style="animation-delay:2.7s" x="604" y="252" font-size="13"><tspan fill="#ef233c">[..]</tspan><tspan x="650" fill="#a1a1aa">siguiente</tspan><tspan x="760" fill="#ef233c">tu equipo</tspan></text>

    <rect x="0" y="319" width="1000" height="1" fill="#ef233c" fill-opacity=".25"/>
    <rect class="sweep" x="0" y="316" width="300" height="4" fill="url(#sw)"/>
  </g>
</svg>
