<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="while (alive) { learn(); build(); repeat(); }">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef233c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#ef233c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="90" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace; }
    .sweep { animation: sweep 4s linear infinite; }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1000px); } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="90" fill="#09090b"/>
    <rect class="sweep" x="0" y="0" width="300" height="3" fill="url(#sw)"/>
    <text x="500" y="52" text-anchor="middle" font-size="18" fill="#a1a1aa"><tspan fill="#ef233c">while</tspan> (alive) { <tspan fill="#fafafa">learn</tspan>(); <tspan fill="#fafafa">build</tspan>(); <tspan fill="#fafafa">repeat</tspan>(); }</text>
  </g>
</svg>
